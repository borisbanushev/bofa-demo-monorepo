name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  authentication-service:
    name: Authentication Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/authentication-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: mvn test --batch-mode

  notification-service:
    name: Notification Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/notification-service/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  pii-data-handler:
    name: PII Data Handler Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pii-data-handler
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
